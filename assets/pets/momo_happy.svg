<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" style="shape-rendering: crispEdges;">
  <!-- Momo the Bunny-Cat Pixel Art Companion - Happy State -->
  <ellipse cx="16" cy="30" rx="9" ry="2" fill="rgba(140,113,135,0.22)" style="shape-rendering: auto;"/>
  
  <!-- Left Ear slightly bouncing -->
  <rect x="6" y="2" width="5" height="1" fill="#8C7187"/>
  <rect x="5" y="3" width="1" height="8" fill="#8C7187"/>
  <rect x="11" y="3" width="1" height="8" fill="#8C7187"/>
  <rect x="6" y="3" width="5" height="8" fill="#FFFBF5"/>
  <rect x="7" y="4" width="3" height="6" fill="#F8CFDF"/>
  <rect x="8" y="5" width="1" height="4" fill="#F3AEC5"/>
  
  <!-- Right Ear slightly bouncing -->
  <rect x="21" y="2" width="5" height="1" fill="#8C7187"/>
  <rect x="20" y="3" width="1" height="8" fill="#8C7187"/>
  <rect x="26" y="3" width="1" height="8" fill="#8C7187"/>
  <rect x="21" y="3" width="5" height="8" fill="#FFFBF5"/>
  <rect x="22" y="4" width="3" height="6" fill="#F8CFDF"/>
  <rect x="23" y="5" width="1" height="4" fill="#F3AEC5"/>

  <!-- Head Outline -->
  <rect x="8" y="9" width="16" height="1" fill="#8C7187"/>
  <rect x="6" y="10" width="2" height="1" fill="#8C7187"/>
  <rect x="24" y="10" width="2" height="1" fill="#8C7187"/>
  <rect x="5" y="11" width="1" height="9" fill="#8C7187"/>
  <rect x="26" y="11" width="1" height="9" fill="#8C7187"/>
  <rect x="6" y="20" width="2" height="1" fill="#8C7187"/>
  <rect x="24" y="20" width="2" height="1" fill="#8C7187"/>
  <rect x="8" y="21" width="16" height="1" fill="#8C7187"/>

  <!-- Head Fill -->
  <rect x="8" y="10" width="16" height="10" fill="#FFFBF5"/>
  <rect x="6" y="11" width="20" height="9" fill="#FFFBF5"/>

  <!-- Cheeks Blush (deeper blush!) -->
  <rect x="7" y="16" width="4" height="3" fill="#FF8CA3"/>
  <rect x="21" y="16" width="4" height="3" fill="#FF8CA3"/>

  <!-- Happy Curved Eyes (^_^ style) -->
  <rect x="9" y="14" width="1" height="2" fill="#514452"/>
  <rect x="10" y="13" width="2" height="1" fill="#514452"/>
  <rect x="12" y="14" width="1" height="2" fill="#514452"/>
  <rect x="19" y="14" width="1" height="2" fill="#514452"/>
  <rect x="20" y="13" width="2" height="1" fill="#514452"/>
  <rect x="22" y="14" width="1" height="2" fill="#514452"/>

  <!-- Open Happy Mouth -->
  <rect x="15" y="16" width="2" height="1" fill="#E892A2"/>
  <rect x="14" y="17" width="4" height="2" fill="#E892A2"/>
  <rect x="15" y="18" width="2" height="1" fill="#FF6B8B"/>

  <!-- Body -->
  <rect x="10" y="22" width="12" height="6" fill="#FFFBF5"/>
  <rect x="9" y="23" width="1" height="5" fill="#8C7187"/>
  <rect x="22" y="23" width="1" height="5" fill="#8C7187"/>
  <rect x="10" y="28" width="12" height="1" fill="#8C7187"/>
  <!-- Paws Raised slightly in joy -->
  <rect x="9" y="22" width="3" height="3" fill="#F8EDDE"/>
  <rect x="20" y="22" width="3" height="3" fill="#F8EDDE"/>

  <!-- Lavender Collar Ribbon & Pearl -->
  <rect x="12" y="21" width="3" height="2" fill="#D8C5E8"/>
  <rect x="17" y="21" width="3" height="2" fill="#D8C5E8"/>
  <rect x="15" y="21" width="2" height="2" fill="#EBCAD9"/>
  <rect x="15.5" y="21.5" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="23" width="2" height="2" fill="#D8C5E8"/>
  <rect x="17" y="23" width="2" height="2" fill="#D8C5E8"/>
  
  <!-- Floating Hearts above -->
  <!-- Big Heart -->
  <path d="M16 2.5 C15 0.5 12 0.5 12 3 C12 5.5 16 8 16 8 C16 8 20 5.5 20 3 C20 0.5 17 0.5 16 2.5 Z" fill="#FF7096" style="shape-rendering: auto;"/>
  <!-- Little Sparkles -->
  <polygon points="3,6 4,4 5,6 4,8" fill="#FAD02C" style="shape-rendering: auto;"/>
  <polygon points="27,6 28,4 29,6 28,8" fill="#FAD02C" style="shape-rendering: auto;"/>
</svg>

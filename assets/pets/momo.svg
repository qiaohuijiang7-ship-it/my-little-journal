<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" style="shape-rendering: crispEdges;">
  <!-- Momo the Bunny-Cat Pixel Art Companion -->
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="9" ry="2" fill="rgba(140,113,135,0.18)" style="shape-rendering: auto;"/>
  
  <!-- Left Ear -->
  <rect x="7" y="3" width="5" height="1" fill="#8C7187"/>
  <rect x="6" y="4" width="1" height="8" fill="#8C7187"/>
  <rect x="12" y="4" width="1" height="8" fill="#8C7187"/>
  <rect x="7" y="4" width="5" height="8" fill="#FFFBF5"/>
  <rect x="8" y="5" width="3" height="6" fill="#F8CFDF"/>
  <rect x="9" y="6" width="1" height="4" fill="#F3AEC5"/>
  
  <!-- Right Ear -->
  <rect x="20" y="3" width="5" height="1" fill="#8C7187"/>
  <rect x="19" y="4" width="1" height="8" fill="#8C7187"/>
  <rect x="25" y="4" width="1" height="8" fill="#8C7187"/>
  <rect x="20" y="4" width="5" height="8" fill="#FFFBF5"/>
  <rect x="21" y="5" width="3" height="6" fill="#F8CFDF"/>
  <rect x="22" y="6" width="1" height="4" fill="#F3AEC5"/>

  <!-- Head Outline -->
  <rect x="8" y="10" width="16" height="1" fill="#8C7187"/>
  <rect x="6" y="11" width="2" height="1" fill="#8C7187"/>
  <rect x="24" y="11" width="2" height="1" fill="#8C7187"/>
  <rect x="5" y="12" width="1" height="9" fill="#8C7187"/>
  <rect x="26" y="12" width="1" height="9" fill="#8C7187"/>
  <rect x="6" y="21" width="2" height="1" fill="#8C7187"/>
  <rect x="24" y="21" width="2" height="1" fill="#8C7187"/>
  <rect x="8" y="22" width="16" height="1" fill="#8C7187"/>

  <!-- Head Fill -->
  <rect x="8" y="11" width="16" height="10" fill="#FFFBF5"/>
  <rect x="6" y="12" width="20" height="9" fill="#FFFBF5"/>

  <!-- Cheeks Blush -->
  <rect x="7" y="17" width="3" height="2" fill="#FFAEC0"/>
  <rect x="22" y="17" width="3" height="2" fill="#FFAEC0"/>

  <!-- Eyes with sweet highlights -->
  <rect x="10" y="14" width="3" height="4" fill="#514452"/>
  <rect x="10" y="14" width="1" height="2" fill="#FFFFFF"/>
  <rect x="19" y="14" width="3" height="4" fill="#514452"/>
  <rect x="19" y="14" width="1" height="2" fill="#FFFFFF"/>

  <!-- Nose & Mouth (w style) -->
  <rect x="15.5" y="17" width="1" height="1" fill="#E892A2"/>
  <rect x="14" y="18" width="1" height="1" fill="#8C7187"/>
  <rect x="15" y="19" width="2" height="1" fill="#8C7187"/>
  <rect x="17" y="18" width="1" height="1" fill="#8C7187"/>

  <!-- Body -->
  <rect x="10" y="23" width="12" height="6" fill="#FFFBF5"/>
  <rect x="9" y="24" width="1" height="5" fill="#8C7187"/>
  <rect x="22" y="24" width="1" height="5" fill="#8C7187"/>
  <rect x="10" y="29" width="12" height="1" fill="#8C7187"/>
  <!-- Paws -->
  <rect x="11" y="26" width="3" height="3" fill="#F8EDDE"/>
  <rect x="18" y="26" width="3" height="3" fill="#F8EDDE"/>

  <!-- Lavender Collar Ribbon & Pearl -->
  <!-- Ribbon Left Loop -->
  <rect x="12" y="22" width="3" height="2" fill="#D8C5E8"/>
  <!-- Ribbon Right Loop -->
  <rect x="17" y="22" width="3" height="2" fill="#D8C5E8"/>
  <!-- Center Knot -->
  <rect x="15" y="22" width="2" height="2" fill="#8C7187"/>
  <rect x="15" y="22" width="2" height="2" fill="#EBCAD9"/>
  <!-- Pearl Center -->
  <rect x="15.5" y="22.5" width="1" height="1" fill="#FFFFFF"/>
  <!-- Ribbon Tails -->
  <rect x="13" y="24" width="2" height="2" fill="#D8C5E8"/>
  <rect x="17" y="24" width="2" height="2" fill="#D8C5E8"/>
  
  <!-- Tiny Twinkle Star near ear -->
  <polygon points="4,7 5,6 6,7 5,8" fill="#FAD02C" style="shape-rendering: auto;"/>
</svg>
